<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketPro - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="shortcut icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TicketPro">
    <meta name="application-name" content="TicketPro">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primario: #1a237e;
            --color-primario-hover: #121858;
            --degradado-fondo: radial-gradient(circle at center, #283593 0%, #1a237e 40%, #0d1241 100%);
            --texto-principal: #333333;
            --texto-atenuado: #666666;
            --texto-enlace: #1a237e;
            --color-borde: #e0e0e0;
            --fondo-entrada: #f8f9fa;
            --blanco: #ffffff;
            --sombra: 0 10px 25px rgba(0, 0, 0, 0.2);
            --radio-borde: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--degradado-fondo);
            background-attachment: fixed;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            background: var(--color-primario);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--texto-principal);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i:not(.toggle-password) {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            border: 1px solid var(--color-borde);
            border-radius: 10px;
            background: var(--fondo-entrada);
            transition: all 0.3s ease;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .btn-login {
            width: 100%;
            background: var(--color-primario);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        @media (min-width: 769px) {
            .login-container {
                width: 100%;
                max-width: 480px;
                padding: 20px;
            }

            .login-card {
                background: var(--blanco);
                padding: 50px;
                border-radius: 24px;
                box-shadow: var(--sombra);
                text-align: center;
                animation: fadeInDown 0.6s ease-out;
            }

            .subtitle {
                color: var(--texto-atenuado);
                font-size: 15px;
                margin-bottom: 40px;
            }

            .input-wrapper input {
                padding: 14px 14px 14px 45px;
                font-size: 15px;
            }

            .btn-login {
                padding: 16px;
                font-size: 17px;
                margin-top: 10px;
                margin-bottom: 32px;
            }

            .btn-login:hover {
                background: var(--color-primario-hover);
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
            }

            @keyframes fadeInDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        @media (max-width: 768px) {
            body {
                align-items: center;
                padding: 20px 0;
            }

            .login-container {
                width: 100%;
                padding: 16px;
            }

            .login-card {
                background: var(--blanco);
                padding: 40px 24px;
                border-radius: 20px;
                box-shadow: var(--sombra);
                text-align: center;
            }

            .logo-section {
                margin-bottom: 12px;
            }

            .brand-name {
                font-size: 22px;
            }

            .subtitle {
                color: var(--texto-atenuado);
                font-size: 14px;
                margin-bottom: 28px;
            }

            .input-wrapper input {
                padding: 12px 12px 12px 40px;
                font-size: 16px;
            }

            .btn-login {
                padding: 15px;
                font-size: 16px;
                margin-bottom: 24px;
            }

            .forgot-password,
            .footer-text {
                font-size: 13px;
            }

            .remember-me span {
                font-size: 13px;
            }
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--color-primario);
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
        }

        .forgot-password {
            font-size: 12px;
            color: var(--texto-enlace);
            text-decoration: none;
            font-weight: 600;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--color-primario);
        }

        .footer-text {
            font-size: 14px;
            color: var(--texto-atenuado);
        }

        .footer-text a {
            color: var(--texto-enlace);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <span class="brand-name">TicketPro</span>
            </div>
            <p class="subtitle">Inicia sesión en tu cuenta</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Tu usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="far fa-eye-slash toggle-password" onclick="togglePassword()"></i>
                    </div>
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="remember-me">
                    <span>Mantener sesión iniciada</span>
                </label>

                <button type="submit" class="btn-login">Entrar</button>

            </form>

            <p class="footer-text">
                ¿No tienes una cuenta? <a href="#">Crea una aquí</a>
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const campoContrasena = document.getElementById('password');
            const iconoAlternar = document.querySelector('.toggle-password');

            if (campoContrasena.type === 'password') {
                campoContrasena.type = 'text';
                iconoAlternar.classList.remove('fa-eye-slash');
                iconoAlternar.classList.add('fa-eye');
            } else {
                campoContrasena.type = 'password';
                iconoAlternar.classList.remove('fa-eye');
                iconoAlternar.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>

</html>
