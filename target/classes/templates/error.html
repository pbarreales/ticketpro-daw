<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketPro - Página no encontrada</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-principal: #1a237e;
            --color-principal-foco: #121858;
            --degradado-fondo: radial-gradient(circle at center, #283593 0%, #1a237e 40%, #0d1241 100%);
            --texto-atenuado: #666666;
            --blanco: #ffffff;
            --sombra-tarjeta: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--degradado-fondo);
            background-attachment: fixed;
        }

        .contenedor-error {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .tarjeta-error {
            background: var(--blanco);
            padding: 50px;
            border-radius: 24px;
            box-shadow: var(--sombra-tarjeta);
            text-align: center;
        }

        .seccion-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .icono-logo {
            background: var(--color-principal);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nombre-marca {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        .icono-error {
            font-size: 64px;
            color: var(--color-principal);
            margin: 30px 0 20px;
        }

        .mensaje-error {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitulo-error {
            color: var(--texto-atenuado);
            font-size: 15px;
            margin-bottom: 35px;
        }

        .boton-accion {
            display: inline-block;
            width: 100%;
            background: var(--color-principal);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 16px;
            font-size: 17px;
            text-decoration: none;
        }

        .boton-accion:hover {
            background: var(--color-principal-foco);
        }

        @media (max-width: 768px) {
            .contenedor-error {
                padding: 12px;
            }

            .tarjeta-error {
                padding: 35px 20px;
                border-radius: 20px;
            }

            .nombre-marca {
                font-size: 22px;
            }

            .icono-error {
                font-size: 48px;
            }

            .boton-accion {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="contenedor-error">
        <div class="tarjeta-error">
            <div class="seccion-logo">
                <div class="icono-logo"><i class="fas fa-ticket-alt"></i></div>
                <span class="nombre-marca">TicketPro</span>
            </div>
            <div class="icono-error">
                <i class="fas fa-folder-open"></i>
            </div>
            <p class="mensaje-error">No hay ningún ticket por aquí...</p>
            <p class="subtitulo-error">La página que buscas no existe o no tienes acceso.</p>
            <button class="boton-accion" id="btnAcceso">
                ¡Accede al dashboard o loguéate para ello!
            </button>
        </div>
    </div>

    <script>
        document.getElementById('btnAcceso').addEventListener('click', function () {
            // Si hay sesión activa en sessionStorage, va al dashboard; si no, al login
            var usuarioId = sessionStorage.getItem('usuarioId');
            if (usuarioId) {
                window.location.href = '/dashboard.html';
            } else {
                window.location.href = '/login';
            }
        });
    </script>
</body>

</html>
